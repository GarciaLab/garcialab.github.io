about: >
  Biology is being revolutionized by new experimental techniques that have made
  it possible to quantitatively query the inner workings of molecules, cells,
  and multicellular organisms in ways that were previously unimaginable.
  The objective of this course is to respond to this deluge of quantitative
  data through quantitative models and the use of biological numeracy.
  We will explore a broad array of topics from modern biology using the
  language of physics, mathematics, and computation, emphasizing the kinds
  of simple calculations that one can do with a stick in the sand.
  <br/><br/>
  We will draw examples from across modern biology, including cell biology,
  gene regulation, genomics, developmental biology, and neuroscience, to
  develop theoretical models that make precise, quantitative predictions
  about biological phenomena. These predictions will be explored through
  hands-on analysis of experimental data, numerical simulations, and the
  development of original scientific projects.
  <br/><br/>
  Physical biology will be introduced not simply as a collection of quantitative
  techniques, but as a way of asking biological questions. Science is often
  taught as established facts and techniques; research also requires deciding
  which questions are worth asking, determining how to answer them, acquiring
  new tools along the way, and convincing others that conclusions are justified.
  This course provides an authentic experience of that process.
  <br/><br/>
  Lectures introduce the conceptual framework of physical biology, while the
  laboratory provides an opportunity to investigate an original scientific
  question. Throughout the semester, students will repeatedly refine their
  questions, analyses, and presentations through discussions with the
  instructor, GSI, and classmates, mirroring the iterative nature of scientific
  research. Students will learn to formulate scientific questions, develop
  quantitative approaches to answer them, and communicate their findings
  through presentations and discussion.
  <br/><br/>
  No previous coding or advanced mathematics experience is required.
  The course is designed to be broadly accessible.

structure: >
  The course meets twice each week: one two-hour lecture and one two-hour
  laboratory. Meeting times and locations are TBD.
  <br/><br/>
  Lectures introduce biological estimation, dynamics, probability, single-cell
  genomics, diffusion, exploratory dynamics, pattern formation, entropy,
  statistical mechanics, gene regulation, and biological networks.
  <br/><br/>
  The laboratory is a scientific workshop. Teams of two investigate an original
  question, refining their projects through regular discussions with the
  instructor and GSI. Discussions of the Protocol of Science address choosing
  questions, formulating hypotheses, interpreting evidence, and communicating
  results. Computational and mathematical tutorials will respond to project needs.
  Weekly homework provides ungraded practice and self-assessment; solutions
  will be provided.
  <br/><br/>
  <b>Project milestones</b><br/>
  Week 3: research proposal, with a one-page abstract and a 10-minute presentation.<br/>
  Week 8: progress report, with a 3-5 page manuscript draft and a 10-minute presentation.<br/>
  Week 14: research article, with a polished 6-8 page paper and a 10-minute final presentation.<br/>
  Each presentation is followed by approximately 10 minutes of questions.
  Reports follow the scientific publication process and incorporate feedback.
  Students enrolled in MCB237L are expected to contribute graduate-level
  engagement with primary literature, quantitative depth, and project leadership.

policies: >
  <b>Submissions</b><br/>
  Written reports, slides, and code must be submitted through Gradescope
  (entry code TBD). Reports are due at the beginning of class one week before
  presentations (Weeks 2, 7, and 13). Slides and code are due at the beginning
  of class on presentation day. No late submissions.
  Explain your reasoning, label plot axes, and use appropriate significant digits.
  <br/><br/>
  <b>Grading</b><br/>
  Participation: 15%; research proposal: 15%; progress presentation: 10%;
  progress report: 15%; final presentation: 20%; research article: 25%.
  Grades are not curved. See the full syllabus for the letter-grade scale.
  <br/><br/>
  <b>Attendance and support</b><br/>
  Attend every lecture and laboratory and plan to attend at least one weekly
  office hour regularly. Repeated unexcused absences affect participation grades.
  Notify the instructor and GSI in writing by Week 2 of known potential conflicts.
  Use Piazza for assignment and logistics questions (course link TBD).
  For illness, disability accommodations, religious observance, or other serious
  personal circumstances, contact the instructor and GSI privately by email
  as early as possible. Disability accommodations require a DSP Letter of
  Accommodation. Obtain missed notes from classmates.
  <br/><br/>
  <b>Scientific tools and academic integrity</b><br/>
  AI tools are permitted and encouraged, but never required. No project requires
  paid software or subscriptions. Students remain responsible for accuracy,
  originality, and scientific integrity and must independently verify generated
  claims, citations, calculations, and code.
  Every written submission must acknowledge each AI system used, link to it,
  describe its use, and explain how its output entered the work. Cite derived
  material in the text and references and retain representative prompts and
  outputs for review if requested. Never enter sensitive or personally
  identifiable information into these systems.
  Each student must be able to explain, reproduce, and defend the team's work.
  Assessment relies on discussion, not automated AI detection. Suspected
  violations are reported to the Center for Student Conduct and may require
  redoing work in person. Attribute all sources and obtain permission before
  distributing course materials. See the full syllabus for complete policies.

